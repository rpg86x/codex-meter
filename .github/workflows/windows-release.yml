name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Electron runtime
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the Electron runtime' }
      - name: Check JavaScript
        run: npm run check
      - name: Test encrypted sync
        run: npm run test:sync
      - name: Build installer
        run: npm run build:installer
      - name: Package and verify easy-install ZIP
        shell: pwsh
        run: ./package-download.ps1
      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-Item release/*Setup*.exe, release/Codex-Meter-Windows.zip | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-Windows
          path: |
            release/*Setup*.exe
            release/Codex-Meter-Windows.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Increase the version first." }
          (Get-Content .github/release-notes.md -Raw).Replace('VERSION', $version) | Set-Content release/notes.md -Encoding utf8
          $installer = "release/Codex-Meter-Setup-$version-x64.exe"
          gh release create $tag release/Codex-Meter-Windows.zip $installer release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Codex Meter $version" --notes-file release/notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release' }
